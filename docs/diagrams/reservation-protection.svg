<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 630" width="1240" height="630" role="img" aria-label="Figure 3 · Protecting the rate-limited reservation system" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="m64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="m64748bs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#64748B"/></marker><marker id="m4f46e5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="m4f46e5s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4F46E5"/></marker><marker id="me11d48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E11D48"/></marker><marker id="me11d48s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#E11D48"/></marker><marker id="m059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="m059669s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#059669"/></marker><marker id="md97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="md97706s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#D97706"/></marker><marker id="mdc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="mdc2626s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#DC2626"/></marker></defs><rect width="1240" height="630" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><text x="28" y="38" font-size="17" font-weight="700" fill="#0F172A">Figure 3 · Protecting the rate-limited reservation system</text><text x="28" y="58" font-size="11.5" fill="#475569">Callers are correlated: keep a copy per flight, ask the PSS once for many callers, queue the rest by priority.</text><rect x="28" y="290" width="120" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="88.0" y="315.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Domain agent</text><text x="88.0" y="331.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">tool call</text><rect x="168" y="290" width="132" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="234.0" y="308.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Policy engine</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="234.0" y="324.2">authorise ·</tspan><tspan x="234.0" y="337.8">guardrails</tspan></text><rect x="320" y="290" width="150" height="60" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/><text x="395.0" y="308.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">MCP server</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="395.0" y="324.2">status · options</tspan><tspan x="395.0" y="337.8">rebook · notify</tspan></text><path d="M148,320 L168,320" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#m64748b)"/><path d="M300,320 L320,320" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#m64748b)"/><path d="M470,320 L524,320" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#m059669)"/><rect x="508" y="240" width="560" height="200" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/><text x="522" y="260" font-size="10.5" font-weight="700" fill="#059669" text-anchor="start">CONNECTOR LAYER · RATE LIMITING LIVES HERE</text><rect x="524" y="290" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/><text x="599.0" y="313.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Saved copy</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="599.0" y="329.2">status · manifest · options</tspan><tspan x="599.0" y="342.8">fresh for a set time (TTL)</tspan></text><rect x="700" y="290" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/><text x="775.0" y="313.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Ask once</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="775.0" y="329.2">1,000 callers on AT123</tspan><tspan x="775.0" y="342.8">→ 1 PSS query</tspan></text><rect x="876" y="290" width="176" height="70" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/><text x="964.0" y="313.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Priority lanes</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="964.0" y="329.2">P0 book 40% · P1 find booking 30%</tspan><tspan x="964.0" y="342.8">P2 options 20% · P3 status 10%</tspan></text><path d="M674,325 L700,325" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#m4f46e5)"/><text x="687" y="316" font-size="10.5" font-weight="400" fill="#4F46E5" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">miss</text><path d="M850,325 L876,325" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#m4f46e5)"/><text x="524" y="392" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">Circuit breaker per endpoint: opens at 50% errors over 10 s, or p95 above 2 s.</text><text x="524" y="410" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">Reads retry once, only if it fits the turn budget. Writes are never retried blindly.</text><rect x="1110" y="290" width="100" height="70" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.6"/><text x="1160.0" y="313.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">PSS</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="1160.0" y="329.2">≈ 50 TPS</tspan><tspan x="1160.0" y="342.8">(assumed)</tspan></text><path d="M1052,325 L1110,325" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#m059669)"/><rect x="508" y="84" width="560" height="112" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/><text x="522" y="104" font-size="10.5" font-weight="700" fill="#059669" text-anchor="start">BEFORE THE WAVE · PREPARE ON THE EVENT</text><rect x="524" y="120" width="130" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="589.0" y="143.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">IROPS feed</text><text x="589.0" y="159.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">flight.cancelled</text><rect x="690" y="120" width="170" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="775.0" y="136.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Pre-warm worker</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="775.0" y="152.2">manifest once · options</tspan><tspan x="775.0" y="165.8">per route and cabin</tspan></text><path d="M654,148 L690,148" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#m64748b)"/><text x="672" y="140" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">event</text><path d="M775,176 L775,214 L599,214 L599,290" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#m4f46e5)"/><text x="690" y="208" font-size="10.5" font-weight="400" fill="#4F46E5" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">writes</text><path d="M860,148 L964,148 L964,290" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m059669)"/><text font-size="10.5" font-weight="400" fill="#059669" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan x="972" y="223.2">pre-warm reads</tspan><tspan x="972" y="236.8">use the P3 lane</tspan></text><rect x="28" y="392" width="460" height="100" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2"/><text x="42" y="412" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="start">WHAT IS SAFE TO KEEP</text><text x="44" y="430" font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="start">Flight status: refreshed by events, 30 s safety limit</text><text x="44" y="447" font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="start">Manifest: until the flight closes · options: 20–30 s, offer only</text><text x="44" y="464" font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="start">Booking: for the call only · holds and commits: never kept</text><rect x="28" y="510" width="1184" height="76" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/><text x="42" y="530" font-size="10.5" font-weight="700" fill="#DC2626" text-anchor="start">WHEN A LANE IS FULL, THE CALLER STILL GETS AN ANSWER</text><rect x="44" y="538" width="275" height="40" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/><text x="181.5" y="553.0" font-size="11.5" font-weight="650" fill="#0F172A" text-anchor="middle">P0 → deferred commit</text><text x="181.5" y="569.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">recorded, booked later, SMS</text><rect x="337" y="538" width="275" height="40" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/><text x="474.5" y="553.0" font-size="11.5" font-weight="650" fill="#0F172A" text-anchor="middle">P1 → booking snapshot</text><text x="474.5" y="569.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">labelled &quot;as of 14:02&quot;</text><rect x="630" y="538" width="275" height="40" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/><text x="767.5" y="553.0" font-size="11.5" font-weight="650" fill="#0F172A" text-anchor="middle">P2 → indicative copy</text><text x="767.5" y="569.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">re-checked live before booking</text><rect x="923" y="538" width="275" height="40" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/><text x="1060.5" y="553.0" font-size="11.5" font-weight="650" fill="#0F172A" text-anchor="middle">P3 → saved copy only</text><text x="1060.5" y="569.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">event-fed status</text><text x="28" y="614" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">PSS = airline reservation system · TTL = how long a saved answer stays fresh · P0–P3 = priority 0 (highest) to 3 · IROPS = airline disruption events</text></svg>
