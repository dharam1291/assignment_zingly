<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" width="1240" height="660" role="img" aria-label="Figure 5 · Protecting the rate-limited reservation system during a 20× spike" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="m64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="m64748bs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#64748B"/></marker><marker id="m4f46e5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="m4f46e5s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4F46E5"/></marker><marker id="me11d48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E11D48"/></marker><marker id="me11d48s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#E11D48"/></marker><marker id="m059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="m059669s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#059669"/></marker><marker id="md97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="md97706s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#D97706"/></marker><marker id="mdc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="mdc2626s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#DC2626"/></marker></defs><rect width="1240" height="660" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><text x="28" y="38" font-size="17" font-weight="700" fill="#0F172A">Figure 5 · Protecting the rate-limited reservation system during a 20× spike</text><text x="28" y="58" font-size="11.5" fill="#475569">Callers are correlated: thousands ask about the same cancelled flights. Cache per flight / O&amp;D, coalesce, then admit by priority.</text><rect x="28" y="84" width="820" height="112" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/><text x="42" y="104" font-size="10.5" font-weight="700" fill="#059669" text-anchor="start">BEFORE THE WAVE · PRE-WARM ON THE EVENT</text><rect x="48" y="118" width="190" height="58" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="143.0" y="142.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Ops / IROPS feed</text><text x="143.0" y="158.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">flight.cancelled AT123</text><rect x="318" y="118" width="220" height="58" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="428.0" y="135.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Disruption Worker</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="428.0" y="151.2">pull manifest once · options</tspan><tspan x="428.0" y="164.8">per O&amp;D + cabin</tspan></text><rect x="618" y="118" width="214" height="58" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/><text x="725.0" y="135.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Disruption read model</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="725.0" y="151.2">status · manifest · ANI index</tspan><tspan x="725.0" y="164.8">indicative options</tspan></text><path d="M238,147 L318,147" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#m64748b)"/><text x="278" y="139" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">event</text><path d="M538,147 L618,147" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#m64748b)"/><text x="578" y="139" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">writes</text><path d="M428,176 L428,214 L970,214 L970,252" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m059669)"/><text x="860" y="208" font-size="10.5" font-weight="400" fill="#059669" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">low-priority reads via lanes P2 / P3</text><rect x="40" y="292" width="150" height="70" rx="8" fill="#fff" stroke="#CBD5E1"/><rect x="34" y="298" width="150" height="70" rx="8" fill="#fff" stroke="#CBD5E1"/><rect x="28" y="304" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="103.0" y="334.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">1,000 callers</text><text x="103.0" y="350.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">all on AT123 → BOS</text><rect x="238" y="304" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/><text x="318.0" y="334.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Tool calls</text><text x="318.0" y="350.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">status · options · PNR</text><rect x="458" y="304" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/><text x="538.0" y="327.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Cache lookup</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="538.0" y="343.2">tenant-prefixed keys</tspan><tspan x="538.0" y="356.8">TTL per data class</tspan></text><rect x="678" y="304" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/><text x="758.0" y="327.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Single-flight</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="758.0" y="343.2">concurrent misses on a key</tspan><tspan x="758.0" y="356.8">→ 1 upstream call</tspan></text><path d="M178,339 L238,339" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#m4f46e5)"/><path d="M398,339 L458,339" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#m4f46e5)"/><path d="M618,339 L678,339" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#m64748b)"/><text x="648" y="331" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">miss</text><path d="M538,304 L538,244 L725,244 L725,176" fill="none" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m4f46e5)"/><text x="548" y="266" font-size="10.5" font-weight="400" fill="#4F46E5" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">hit → answer in &lt; 50 ms</text><text x="758" y="396" font-size="11.5" font-weight="700" fill="#4F46E5" text-anchor="middle">1,000 requests → 1 PSS call</text><rect x="884" y="236" width="196" height="330" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/><text x="898" y="256" font-size="10.5" font-weight="700" fill="#4F46E5" text-anchor="start">ADMISSION CONTROL</text><rect x="900" y="270" width="164" height="48" rx="7" fill="#fff" stroke="#4F46E5" stroke-width="1.3"/><rect x="901" y="271" width="162" height="5" rx="2" fill="#4F46E5" opacity=".55"/><text x="910" y="295" font-size="11.5" font-weight="650" fill="#0F172A" text-anchor="start">P0 commit / hold</text><text x="910" y="310" font-size="10" font-weight="400" fill="#475569" text-anchor="start">40% of budget · wait ≤ 3 s</text><rect x="900" y="332" width="164" height="48" rx="7" fill="#fff" stroke="#4F46E5" stroke-width="1.3"/><rect x="901" y="333" width="122" height="5" rx="2" fill="#4F46E5" opacity=".55"/><text x="910" y="357" font-size="11.5" font-weight="650" fill="#0F172A" text-anchor="start">P1 PNR retrieve</text><text x="910" y="372" font-size="10" font-weight="400" fill="#475569" text-anchor="start">30% of budget · wait ≤ 1.5 s</text><rect x="900" y="394" width="164" height="48" rx="7" fill="#fff" stroke="#4F46E5" stroke-width="1.3"/><rect x="901" y="395" width="81" height="5" rx="2" fill="#4F46E5" opacity=".55"/><text x="910" y="419" font-size="11.5" font-weight="650" fill="#0F172A" text-anchor="start">P2 availability</text><text x="910" y="434" font-size="10" font-weight="400" fill="#475569" text-anchor="start">20% of budget · wait ≤ 0.5 s</text><rect x="900" y="456" width="164" height="48" rx="7" fill="#fff" stroke="#4F46E5" stroke-width="1.3"/><rect x="901" y="457" width="40" height="5" rx="2" fill="#4F46E5" opacity=".55"/><text x="910" y="481" font-size="11.5" font-weight="650" fill="#0F172A" text-anchor="start">P3 status / bg</text><text x="910" y="496" font-size="10" font-weight="400" fill="#475569" text-anchor="start">10% of budget · wait ≤ 0 s</text><text x="982" y="536" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">token buckets per tenant;</text><text x="982" y="550" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">borrow down, never up</text><path d="M838,339 L900,339" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#m4f46e5)"/><rect x="1112" y="330" width="100" height="96" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.6"/><text x="1162.0" y="359.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">PSS</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="1162.0" y="375.5">≈ 50 TPS</tspan><tspan x="1162.0" y="389.0">per tenant</tspan><tspan x="1162.0" y="402.5">credential</tspan></text><path d="M1064,294 H1088" fill="none" stroke="#059669" stroke-width="1.5"/><path d="M1064,356 H1088" fill="none" stroke="#059669" stroke-width="1.5"/><path d="M1064,418 H1088" fill="none" stroke="#059669" stroke-width="1.5"/><path d="M1064,480 H1088" fill="none" stroke="#059669" stroke-width="1.5"/><path d="M1088,294 V480" fill="none" stroke="#059669" stroke-width="1.5"/><path d="M1088,378 L1112,378" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#m059669)"/><rect x="28" y="470" width="836" height="170" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/><text x="42" y="490" font-size="10.5" font-weight="700" fill="#DC2626" text-anchor="start">WHEN A LANE IS FULL OR THE BREAKER IS OPEN, THE CALLER STILL GETS AN ANSWER</text><rect x="44" y="510" width="190" height="72" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/><text x="139.0" y="534.0" font-size="11.5" font-weight="650" fill="#0F172A" text-anchor="middle">P0 → deferred commit</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="139.0" y="550.2">choice queued under its</tspan><tspan x="139.0" y="563.8">idempotency key · SMS confirm</tspan></text><rect x="249" y="510" width="190" height="72" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/><text x="344.0" y="534.0" font-size="11.5" font-weight="650" fill="#0F172A" text-anchor="middle">P1 → manifest snapshot</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="344.0" y="550.2">labelled &quot;as of 14:02&quot; ·</tspan><tspan x="344.0" y="563.8">no change without live read</tspan></text><rect x="454" y="510" width="190" height="72" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/><text x="549.0" y="534.0" font-size="11.5" font-weight="650" fill="#0F172A" text-anchor="middle">P2 → indicative cache</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="549.0" y="550.2">options offered, re-checked</tspan><tspan x="549.0" y="563.8">live before any commit</tspan></text><rect x="659" y="510" width="190" height="72" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/><text x="754.0" y="534.0" font-size="11.5" font-weight="650" fill="#0F172A" text-anchor="middle">P3 → cache only</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="754.0" y="550.2">flight status from the</tspan><tspan x="754.0" y="563.8">event-fed read model</tspan></text><text x="44" y="606" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">Breaker per endpoint class: opens at 50% errors over 10 s or p95 &gt; 2 s; half-open after 15 s.</text><text x="44" y="624" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">Reads retry once with jitter only if it still fits the turn&#x27;s latency budget. Writes never retry blindly.</text></svg>
