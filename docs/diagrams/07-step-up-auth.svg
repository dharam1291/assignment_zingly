x="570" y="119" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">Atlantica backend</text><rect x="715.0" y="84" width="190" height="46" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/><text x="810" y="103" font-size="12" font-weight="650" fill="#0F172A" text-anchor="middle">Atlantica App</text><text x="810" y="119" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">OIDC session</text><rect x="965.0" y="84" width="190" height="46" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/><text x="1060" y="103" font-size="12" font-weight="650" fill="#0F172A" text-anchor="middle">Atlantica IdP</text><text x="1060" y="119" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">issues assertion</text><path d="M330,156 H567" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#m059669)"/><text x="346" y="149" font-size="10.5" font-weight="400" fill="#059669" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">POST /push { pnrHolderRef, nonce, bindingCode=47 } (OAuth CC)</text><circle cx="330" cy="156" r="9" fill="#059669"/><text x="330" y="159.8" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">1</text><path d="M330,190 H103" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#m4f46e5)"/><text x="314" y="183" font-size="10.5" font-weight="400" fill="#4F46E5" text-anchor="end" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">&quot;Please approve in the app — you&#x27;ll see code 47&quot;</text><circle cx="330" cy="190" r="9" fill="#4F46E5"/><text x="330" y="193.8" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">2</text><path d="M570,224 H807" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#m64748b)"/><text x="690.0" y="217" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">push notification</text><circle cx="570" cy="224" r="9" fill="#4F46E5"/><text x="570" y="227.8" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">3</text><path d="M810,258 H850 V274 H813" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#m64748b)"/><text x="858" y="269" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">code 47 matches · biometric unlock · Approve</text><path d="M810,306 H1057" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#m059669)"/><text x="826" y="299" font-size="10.5" font-weight="400" fill="#059669" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">approve(nonce) with the user&#x27;s access token</text><circle cx="810" cy="306" r="9" fill="#059669"/><text x="810" y="309.8" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">4</text><path d="M1060,340 H333" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#m059669)"/><text x="695.0" y="333" font-size="10.5" font-weight="400" fill="#059669" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">signed JWT { iss=atlantica, aud=zingly:atlantica, sub, rloc, nonce, exp ≤ 120 s }</text><circle cx="1060" cy="340" r="9" fill="#059669"/><text x="1060" y="343.8" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">5</text><path d="M330,374 H370 V390 H333" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#m64748b)"/><text x="378" y="385" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">verify via Atlantica JWKS · aud · nonce · exp · rloc → L3</text><path d="M330,422 H103" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#m4f46e5)"/><text x="314" y="415" font-size="10.5" font-weight="400" fill="#4F46E5" text-anchor="end" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">&quot;Thanks, you&#x27;re verified&quot; → higher-risk action allowed</text><circle cx="330" cy="422" r="9" fill="#4F46E5"/><text x="330" y="425.8" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">6</text><rect x="36" y="454" width="1174" height="38" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/><text font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="middle"><tspan x="623.0" y="470.2">Timeout (60 s) or denied → SMS OTP to the phone on the PNR → else agent handoff flagged assurance=L2.</tspan><tspan x="623.0" y="483.8">The binding code defeats push-fatigue approvals; nonce + 120 s expiry prevent replay.</tspan></text></svg>
