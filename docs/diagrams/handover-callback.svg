<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 500" width="1240" height="500" role="img" aria-label="Figure 4 · Handover with context, and callback when all agents are busy" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="m64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="m64748bs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#64748B"/></marker><marker id="m4f46e5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="m4f46e5s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4F46E5"/></marker><marker id="me11d48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E11D48"/></marker><marker id="me11d48s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#E11D48"/></marker><marker id="m059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="m059669s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#059669"/></marker><marker id="md97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="md97706s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#D97706"/></marker><marker id="mdc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="mdc2626s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#DC2626"/></marker></defs><rect width="1240" height="500" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><text x="28" y="38" font-size="17" font-weight="700" fill="#0F172A">Figure 4 · Handover with context, and callback when all agents are busy</text><text x="28" y="58" font-size="11.5" fill="#475569">The bot returns an outcome and context. Genesys owns the queue, the wait time and the callback, so nothing is custom-built.</text><rect x="28" y="110" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/><text x="103.0" y="133.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Zingly bot</text><text x="103.0" y="149.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">returns AGENT_HANDOVER</text><rect x="230" y="110" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/><text x="325.0" y="133.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Architect flow resumes</text><text x="325.0" y="149.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">reads the call attributes</text><rect x="470" y="110" width="170" height="56" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/><text x="555.0" y="133.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Wait time check</text><text x="555.0" y="149.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">EWT · agents available</text><path d="M178,138 L230,138" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#m4f46e5)"/><path d="M420,138 L470,138" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#md97706)"/><rect x="700" y="60" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/><text x="795.0" y="83.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Skill queue</text><text x="795.0" y="99.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">language · tier · intent</text><rect x="940" y="60" width="250" height="56" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/><text x="1065.0" y="83.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Agent desktop</text><text x="1065.0" y="99.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">screen-pop: who · why · what was tried</text><path d="M640,132 L670,132 L670,88 L700,88" fill="none" stroke="#D97706" stroke-width="1.5" marker-end="url(#md97706)"/><text x="612" y="76" font-size="10.5" font-weight="400" fill="#D97706" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">short wait</text><path d="M890,88 L940,88" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#md97706)"/><rect x="700" y="190" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/><text x="795.0" y="213.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Offer a callback</text><text x="795.0" y="229.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">keep place · confirm number</text><rect x="940" y="190" width="250" height="56" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/><text x="1065.0" y="213.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Callback created</text><text x="1065.0" y="229.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">same attributes attached</text><path d="M640,144 L670,144 L670,218 L700,218" fill="none" stroke="#D97706" stroke-width="1.5" marker-end="url(#md97706)"/><text x="548" y="236" font-size="10.5" font-weight="400" fill="#D97706" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">long wait or all busy</text><path d="M890,218 L940,218" fill="none" stroke="#D97706" stroke-width="1.5" marker-end="url(#md97706)"/><rect x="700" y="290" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="795.0" y="313.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">SMS confirmation</text><text x="795.0" y="329.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">via Twilio</text><rect x="940" y="290" width="250" height="56" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/><text x="1065.0" y="313.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Agent takes the callback</text><text x="1065.0" y="329.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">the same screen-pop appears</text><path d="M795,246 L795,290" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#m64748b)"/><path d="M1065,246 L1065,290" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#md97706)"/><rect x="28" y="210" width="450" height="270" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/><text x="42" y="230" font-size="10.5" font-weight="700" fill="#4F46E5" text-anchor="start">HANDOVER PAYLOAD (CALL ATTRIBUTES)</text><text x="46" y="252" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">conversation_status = AGENT_HANDOVER</text><text x="46" y="276" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">category · subcategory · summary</text><text x="46" y="300" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">who the caller is and how they were verified</text><text x="46" y="324" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">booking · flight · disruption reason</text><text x="46" y="348" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">attempted actions, result and booking state</text><text x="46" y="372" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">  e.g. rebook to AT127: FAILED, booking unchanged</text><text x="46" y="396" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">handoffId: sensitive detail is fetched by a Data</text><text x="46" y="420" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">  Action under OAuth, not stored in attributes</text><rect x="700" y="380" width="490" height="100" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2"/><text x="714" y="400" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="start">WHY THIS WORKS</text><text x="716" y="418" font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="start">Genesys already owns the queue, the wait time and callbacks.</text><text x="716" y="436" font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="start">The agent never asks for the booking reference again.</text><text x="716" y="454" font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="start">A callback carries the same context as a live transfer.</text></svg>
