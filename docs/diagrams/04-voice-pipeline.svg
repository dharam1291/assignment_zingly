" y="135.2">8 kHz telephony model</tspan><tspan x="733.0" y="148.8">80 / 150 ms</tspan></text><rect x="868" y="96" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/><text x="943.0" y="119.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Orchestrator</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="943.0" y="135.2">tools 30/80 · LLM 250/500</tspan><tspan x="943.0" y="148.8">Policy Engine</tspan></text><rect x="1078" y="96" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/><text x="1153.0" y="119.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Streaming TTS</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="1153.0" y="135.2">μ-law 8 kHz out</tspan><tspan x="1153.0" y="148.8">120 / 200 ms</tspan></text><path d="M178,118 L238,118" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#m4f46e5)"/><text font-size="10" font-weight="400" fill="#4F46E5" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan x="208.0" y="95.5">μ-law</tspan><tspan x="208.0" y="108.5">20 ms</tspan></text><path d="M388,118 L448,118" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#m4f46e5)"/><text x="418.0" y="102" font-size="10" font-weight="400" fill="#4F46E5" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">frames</text><path d="M598,118 L658,118" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#m4f46e5)"/><text font-size="10" font-weight="400" fill="#4F46E5" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan x="628.0" y="95.5">partials</tspan><tspan x="628.0" y="108.5">+ finals</tspan></text><path d="M808,118 L868,118" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#m4f46e5)"/><text x="