<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 604" width="1240" height="604" role="img" aria-label="Figure 1 · The solution on a page" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="m64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="m64748bs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#64748B"/></marker><marker id="m4f46e5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="m4f46e5s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4F46E5"/></marker><marker id="me11d48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E11D48"/></marker><marker id="me11d48s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#E11D48"/></marker><marker id="m059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="m059669s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#059669"/></marker><marker id="md97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="md97706s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#D97706"/></marker><marker id="mdc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="mdc2626s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#DC2626"/></marker></defs><rect width="1240" height="604" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><text x="28" y="38" font-size="17" font-weight="700" fill="#0F172A">Figure 1 · The solution on a page</text><text x="28" y="58" font-size="11.5" fill="#475569">Twilio keeps the phone lines, Atlantica keeps its systems of record. Zingly adds the voice agent in between.</text><rect x="28" y="196" width="150" height="84" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="103.0" y="226.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Passenger</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="103.0" y="242.2">&quot;My flight was</tspan><tspan x="103.0" y="255.8">cancelled, rebook me&quot;</tspan></text><rect x="208" y="136" width="196" height="204" rx="12" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.2"/><text x="222" y="156" font-size="10.5" font-weight="700" fill="#E11D48" text-anchor="start">TWILIO · UNCHANGED</text><rect x="224" y="186" width="164" height="112" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="306.0" y="223.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Phone network</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="306.0" y="239.5">same numbers,</tspan><tspan x="306.0" y="253.0">same carrier contract,</tspan><tspan x="306.0" y="266.5">call routing as today</tspan></text><path d="M178,238 L224,238" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#m4f46e5)"/><rect x="440" y="96" width="440" height="284" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/><text x="454" y="116" font-size="10.5" font-weight="700" fill="#4F46E5" text-anchor="start">ZINGLY VOICE AGENT · EU REGION</text><rect x="456" y="132" width="408" height="48" rx="8" fill="#fff" stroke="#4F46E5" stroke-width="1.3"/><circle cx="480" cy="156" r="9" fill="#4F46E5"/><text x="480" y="159.8" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="500" y="152" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="start">Understand</text><text x="500" y="169" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">streaming speech ↔ text, barge-in, &lt; 1.6 s replies</text><path d="M480,166 V206" fill="none" stroke="#4F46E5" stroke-width="1.5"/><rect x="456" y="192" width="408" height="48" rx="8" fill="#fff" stroke="#4F46E5" stroke-width="1.3"/><circle cx="480" cy="216" r="9" fill="#4F46E5"/><text x="480" y="219.8" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="500" y="212" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="start">Identify</text><text x="500" y="229" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">booking ref + surname; app push for risky changes</text><path d="M480,226 V266" fill="none" stroke="#4F46E5" stroke-width="1.5"/><rect x="456" y="252" width="408" height="48" rx="8" fill="#fff" stroke="#4F46E5" stroke-width="1.3"/><circle cx="480" cy="276" r="9" fill="#4F46E5"/><text x="480" y="279.8" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="500" y="272" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="start">Decide</text><text x="500" y="289" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">options within Atlantica&#x27;s policy, refund always offered</text><path d="M480,286 V326" fill="none" stroke="#4F46E5" stroke-width="1.5"/><rect x="456" y="312" width="408" height="48" rx="8" fill="#fff" stroke="#4F46E5" stroke-width="1.3"/><circle cx="480" cy="336" r="9" fill="#4F46E5"/><text x="480" y="339.8" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="500" y="332" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="start">Act</text><text x="500" y="349" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">rebook and confirm by SMS, or hand off to a human</text><path d="M388,238 L440,238" fill="none" stroke="#4F46E5" stroke-width="2" marker-start="url(#m4f46e5s)" marker-end="url(#m4f46e5)"/><text x="414" y="228" font-size="10" font-weight="400" fill="#4F46E5" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">audio</text><rect x="920" y="96" width="292" height="284" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2"/><text x="934" y="116" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="start">OUTCOME FOR THE CALLER</text><rect x="936" y="132" width="260" height="96" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.6"/><text x="1066.0" y="161.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Rebooked by phone</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="1066.0" y="177.5">new itinerary read back,</tspan><tspan x="1066.0" y="191.0">SMS to the contact on the booking,</tspan><tspan x="1066.0" y="204.5">no queue, no agent needed</tspan></text><rect x="936" y="252" width="260" height="112" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/><text x="1066.0" y="282.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Human agent, full context</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="1066.0" y="298.8">agent screen opens with who,</tspan><tspan x="1066.0" y="312.2">which flight and what was tried.</tspan><tspan x="1066.0" y="325.8">All agents busy: a callback</tspan><tspan x="1066.0" y="339.2">that keeps the caller&#x27;s place</tspan></text><path d="M880,180 L936,180" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#m059669)"/><path d="M880,308 L936,308" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#md97706)"/><rect x="440" y="412" width="772" height="96" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/><text x="454" y="432" font-size="10.5" font-weight="700" fill="#059669" text-anchor="start">ATLANTICA SYSTEMS OF RECORD · UNCHANGED</text><rect x="456" y="444" width="260" height="48" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.6"/><text x="586.0" y="463.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Reservation system (PSS)</text><text x="586.0" y="479.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">rate-limited: protected, never overrun</text><rect x="736" y="444" width="200" height="48" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="836.0" y="463.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Disruption feed</text><text x="836.0" y="479.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">cancellations pre-warm answers</text><rect x="956" y="444" width="240" height="48" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/><text x="1076.0" y="463.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Genesys contact centre</text><text x="1076.0" y="479.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">agents, queues, callbacks</text><path d="M680,380 L680,444" fill="none" stroke="#059669" stroke-width="1.5" marker-start="url(#m059669s)" marker-end="url(#m059669)"/><text x="670" y="400" font-size="10.5" font-weight="400" fill="#059669" text-anchor="end" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">cache + priority queue in front</text><path d="M836,444 L836,380" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#m64748b)"/><text x="844" y="404" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">events</text><path d="M1076,364 L1076,444" fill="none" stroke="#D97706" stroke-width="1.5" marker-start="url(#md97706s)" marker-end="url(#md97706)"/><rect x="28" y="530" width="1184" height="56" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/><text x="48" y="550" font-size="10.5" font-weight="700" fill="#DC2626" text-anchor="start">GUARDRAILS</text><text x="150" y="563" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="start">No single factor authorises a change  ·  The AI talks, the tools state facts  ·  Every failure ends with a human, never a dropped call  ·  Passenger data stays in the EU</text></svg>
