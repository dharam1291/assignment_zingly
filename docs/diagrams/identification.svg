<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" width="1240" height="660" role="img" aria-label="Figure 2 · Caller identification, on demand" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="m64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="m64748bs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#64748B"/></marker><marker id="m4f46e5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="m4f46e5s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4F46E5"/></marker><marker id="me11d48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E11D48"/></marker><marker id="me11d48s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#E11D48"/></marker><marker id="m059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="m059669s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#059669"/></marker><marker id="md97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="md97706s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#D97706"/></marker><marker id="mdc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="mdc2626s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#DC2626"/></marker></defs><rect width="1240" height="660" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><text x="28" y="38" font-size="17" font-weight="700" fill="#0F172A">Figure 2 · Caller identification, on demand</text><text x="28" y="58" font-size="11.5" fill="#475569">Verified only when a request needs it. Genesys passes the caller-ID match as a free hint. The Identity service issues the level, never the model.</text><rect x="28" y="120" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="103.0" y="143.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Call connects</text><text x="103.0" y="159.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">welcome + consent played</text><rect x="218" y="120" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/><text x="318.0" y="143.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Caller-ID check</text><text x="318.0" y="159.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">free hint from Genesys</text><path d="M178,148 L218,148" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#m64748b)"/><rect x="470" y="90" width="220" height="56" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/><text x="580.0" y="113.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Likely</text><text x="580.0" y="129.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">caller ID matches a booking</text><rect x="470" y="160" width="220" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="580.0" y="183.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Unknown</text><text x="580.0" y="199.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">public status and FAQ only</text><path d="M418,140 L444,140 L444,118 L470,118" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#m64748b)"/><text x="432" y="100" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">match</text><path d="M418,156 L444,156 L444,188 L470,188" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#m64748b)"/><text x="420" y="206" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no match</text><rect x="740" y="120" width="230" height="56" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/><text x="855.0" y="143.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Ask booking ref + surname</text><text x="855.0" y="159.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">only when the request needs it</text><path d="M690,118 L715,118 L715,148 L740,148" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#m64748b)"/><path d="M690,188 H715 V148" fill="none" stroke="#64748B" stroke-width="1.5"/><rect x="1010" y="120" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/><text x="1110.0" y="143.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Identity service</text><text x="1110.0" y="159.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">checks against the booking</text><path d="M970,148 L1010,148" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#m4f46e5)"/><rect x="1010" y="280" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.6"/><text x="1110.0" y="305.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Verified</text><text x="1110.0" y="321.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">rebook within policy</text><path d="M1110,176 L1110,280" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#m059669)"/><text x="1120" y="232" font-size="10.5" font-weight="400" fill="#059669" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">match</text><rect x="740" y="280" width="230" height="60" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/><text x="855.0" y="305.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Failed attempt</text><text x="855.0" y="321.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">retry, up to 3 times</text><path d="M1040,176 L1040,230 L855,230 L855,280" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#mdc2626)"/><text x="950" y="224" font-size="10.5" font-weight="400" fill="#DC2626" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no match</text><rect x="740" y="400" width="230" height="76" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/><text x="855.0" y="426.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Locked for 1 hour</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="855.0" y="442.2">public info, or a person.</tspan><tspan x="855.0" y="455.8">Agent told: not verified</tspan></text><path d="M855,340 L855,400" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#mdc2626)"/><text x="863" y="374" font-size="10.5" font-weight="400" fill="#DC2626" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">3rd failure</text><rect x="1010" y="400" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="1110.0" y="425.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Higher-risk request?</text><text x="1110.0" y="441.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">split booking · minors · refund</text><path d="M1110,340 L1110,400" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#m64748b)"/><rect x="1010" y="500" width="200" height="64" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/><text x="1110.0" y="520.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Extra check</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="1110.0" y="536.2">app approval (OIDC login)</tspan><tspan x="1110.0" y="549.8">or SMS one-time code</tspan></text><path d="M1110,460 L1110,500" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#m64748b)"/><text x="1120" y="486" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><rect x="740" y="500" width="230" height="64" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/><text x="855.0" y="520.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Handoff as Verified</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="855.0" y="536.2">denied or timed out →</tspan><tspan x="855.0" y="549.8">agent checks in person</tspan></text><path d="M1010,532 L970,532" fill="none" stroke="#D97706" stroke-width="1.5" marker-end="url(#md97706)"/><text x="990" y="524" font-size="10.5" font-weight="400" fill="#D97706" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">denied</text><rect x="470" y="500" width="230" height="64" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.6"/><text x="585.0" y="527.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Strongly verified</text><text x="585.0" y="543.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">higher-risk actions allowed</text><path d="M1110,564 L1110,596 L585,596 L585,564" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#m059669)"/><text x="850" y="590" font-size="10.5" font-weight="400" fill="#059669" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">approved</text><rect x="28" y="240" width="420" height="150" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2"/><text x="42" y="260" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="start">WHO CAN REBOOK BY VOICE?</text><text x="44" y="282" font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="start">Only a Verified caller, within policy, for the</text><text x="44" y="299" font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="start">passengers on that booking. Harm is limited:</text><text x="44" y="316" font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="start">an involuntary move with no cash value,</text><text x="44" y="333" font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="start">announced to the booking&#x27;s own phone and</text><text x="44" y="350" font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="start">email, and reversible by an agent.</text><rect x="28" y="410" width="420" height="150" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/><text x="42" y="430" font-size="10.5" font-weight="700" fill="#DC2626" text-anchor="start">FRAUD CONTROLS</text><text x="44" y="452" font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="start">Velocity limits per caller ID and booking</text><text x="44" y="469" font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="start">Detect many references tried from many numbers</text><text x="44" y="486" font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="start">Never confirm that a booking reference exists</text><text x="44" y="503" font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="start">The model never decides identity: the service</text><text x="44" y="520" font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="start">issues a level and a short-lived session token</text><text x="28" y="640" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">Caller ID = number shown by the phone network · OTP = one-time SMS code · OIDC = the login standard the airline app uses</text></svg>
