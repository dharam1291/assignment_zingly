26"/></marker><marker id="mdc2626s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#DC2626"/></marker><marker id="m0891b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0891B2"/></marker><marker id="m0891b2s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0891B2"/></marker><marker id="m7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="m7c3aeds" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7C3AED"/></marker><marker id="m2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="m2563ebs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2563EB"/></marker><marker id="m0d9488" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="m0d9488s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0D9488"/></marker></defs><rect width="1240" height="470" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><text x="28" y="38" font-size="17" font-weight="700" fill="#0F172A">Multi-tenancy · one deployment, one config file</text><text x="28" y="58" font-size="11.5" fill="#475569">Each process builds one runtime per tenant from the merged sections. A call is matched to a tenant by its dialed number.</text><rect x="28" y="196" width="190" height="84" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/><text x="123.0" y="219.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">config/tenants.yml</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="123.0" y="235.5">platform</tspan><tspan x="123.0" y="249.0">defaults per module</tspan><tspan x="123.0" y="262.5">tenants + overrides</tspan></text><rect x="252" y="208" width="172" height="60" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/><text x="338.0" y="226.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Deep-merge</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="338.0" y="242.2">defaults + each</tspan><tspan x="338.0" y="255.8">tenant block</tspan></text><path d="M218,238 L252,238" fill="none" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#m7c3aed)"/><rect x="470" y="100" width="300" height="126" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/><text x="620.0" y="137.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Atlantica · +448000001234</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="620.0" y="153.8">consent prompt on</tspan><tspan x="620.0" y="167.2">rebooking for 100% of calls</tspan><tspan x="620.0" y="180.8">lanes 40 / 30 / 20 / 10</tspan><tspan x="620.0" y="194.2">deferred commits on</tspan></text><rect x="470" y="256" width="300" height="126" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.6"/><text x="620.0" y="293.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Nordica · +4780001234</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="620.0" y="309.8">no consent prompt</tspan><tspan x="620.0" y="323.2">rebooking canaried to 50%</tspan><tspan x="620.0" y="336.8">lanes 50 / 30 / 10 / 10</tspan><tspan x="620.0" y="350.2">deferred commits off · own queues</tspan></text><path d="M424,228 L446,228 L446,163 L470,163" fill="none" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#m7c3aed)"/><path d="M424,248 L446,248 L446,319 L470,319" fill="none" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#m7c3aed)"/><rect x="830" y="100" width="384" height="52" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/><text x="1022.0" y="121.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Voice agent runtime · atlantica</text><text x="1022.0" y="137.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">router · agents · auth lockouts · handover queues</text><rect x="830" y="166" width="384" height="60" rx="8" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.6"/><text x="1022.0" y="184.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">MCP runtime · /atlantica/mcp</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="1022.0" y="200.2">own lanes · saved copy · breaker · signing key</tspan><tspan x="1022.0" y="213.8">deferred queue · verification throttle</tspan></text><path d="M770,130 L800,130 L800,126 L830,126" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#m2563eb)"/><path d="M800,130 L800,196 L830,196" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#m2563eb)"/><rect x="830" y="256" width="384" height="52" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/><text x="1022.0" y="277.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Voice agent runtime · nordica</text><text x="1022.0" y="293.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">router · agents · auth lockouts · handover queues</text><rect x="830" y="322" width="384" height="60" rx="8" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.6"/><text x="1022.0" y="340.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">MCP runtime · /nordica/mcp</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="1022.0" y="356.2">own lanes · saved copy · breaker · signing key</tspan><tspan x="1022.0" y="369.8">deferred queue · verification throttle</tspan></text><path d="M770,286 L800,286 L800,282 L830,282" fill="none" stroke="#0D9488" stroke-width="1.5" marker-end="url(#m0d9488)"/><path d="M800,286 L800,352 L830,352" fill="none" stroke="#0D9488" stroke-width="1.5" marker-end="url(#m0d9488)"/><text x="28" y="418" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">Isolation: lane buckets, saved copy, breaker, lockout counters, deferred queue, idempotency keys and identity-token keys are all per tenant.</text><text x="28" y="438" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">One tenant&#x27;s storm cannot starve another (tested). A token issued for Atlantica is rejected on /nordica/mcp.</text></svg>
