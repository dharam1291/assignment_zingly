h d="M866,150 H896" fill="none" stroke="#4F46E5" stroke-width="1.5"/><path d="M896,120 V348" fill="none" stroke="#4F46E5" stroke-width="1.5"/><rect x="924" y="92" width="290" height="58" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.6"/><text x="1069.0" y="109.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Fast path</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="1069.0" y="125.2">hi · yes/no · agent · no model</tspan><tspan x="1069.0" y="138.8">cached reply, or yes/no bound to the pending question</tspan></text><path d="M896,120 L924,120" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#m4f46e5)"/><rect x="924" y="168" width="290" height="58" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="1069.0" y="185.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Clarify</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="1069.0" y="201.2">intent unclear: one short question</tspan><tspan x="1069.0" y="214.8">handover after two</tspan></text><path d="M896,196 L924,196" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#m4f46e5)"/><rect x="924" y="244" width="290" height="58" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/><text x="1069.0" y="261.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Same topic</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="1069.0" y="277.2">slot answers (&#x27;ABC123&#x27;) stay with</tspan><tspan x="1069.0" y="290.8">the active domain agent</tspan></text><path d="M896,272 L924,272" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#m4f46e5)"/><rect x="924" y="320" width="290" height="58" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/><text x="1069.0" y="337.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Topic change</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="1069.0" y="353.2">classifier picks a new agent (rollout %)</tspan><tspan x="1069.0" y="366.8">the open task is suspended, resumed later</tspan></text><path d="M896,348 L924,348" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#m4f46e5)"/><path d="M1069,378 V420 H808" fill="none" stroke="#4F46E5" stroke-width="1.5"/><path d="M1214,273 H1226 V420 H1069" fill="none" stroke="#4F46E5" stroke-width="1.5"/><path d="M808,420 L808,470" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#m4f46e5)"/><rect x="708" y="470" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/><text x="808.0" y="486.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Domain agent</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="808.0" y="502.5">rebooking · flight status · FAQ</tspan><tspan x="808.0" y="516.0">identity token stays out of</tspan><tspan x="808.0" y="529.5">tool arguments</tspan></text><rect x="940" y="470" width="274" height="70" rx="8" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.6"/><text x="1077.0" y="493.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">MCP server</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="1077.0" y="509.2">guard · booking scope · lanes</tspan><tspan x="1077.0" y="522.8">saved copy · reservation system</tspan></text><path d="M908,505 L940,505" fill="none" stroke="#0891B2" stroke-width="2" marker-start="url(#m0891b2s)" marker-end="url(#m0891b2)"/><text x="924" y="496" font-size="10.5" font-weight="650" fill="#0891B2" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">tools/call</text><rect x="484" y="470" width="190" height="70" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="579.0" y="493.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Agent reply</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="579.0" y="509.2">next question · done ·</tspan><tspan x="579.0" y="522.8">cannot finish safely</tspan></text><path d="M708,505 L674,505" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#m4f46e5)"/><rect x="260" y="470" width="196" height="70" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/><text x="358.0" y="493.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">AGENT_HANDOVER</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="358.0" y="509.2">who · why · how verified</tspan><tspan x="358.0" y="522.8">what was already tried</tspan></text><path d="M484,505 L456,505" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#mdc2626)"/><rect x="28" y="470" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/><text x="128.0" y="493.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Genesys queue</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="128.0" y="509.2">or callback when the wait</tspan><tspan x="128.0" y="522.8">is long · screen-pop</tspan></text><path d="M260,505 L228,505" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#mdc2626)"/><rect x="28" y="300" width="200" height="64" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.6"/><text x="128.0" y="320.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Reply to the caller</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="128.0" y="336.2">next question, resume the</tspan><tspan x="128.0" y="349.8">suspended task, or &#x27;anything else?&#x27;</tspan></text><path d="M579,470 L579,332 L228,332" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#m059669)"/><path d="M83,300 L83,178" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#m059669)"/><text x="590" y="450" font-size="10.5" font-weight="400" fill="#059669" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">next question / done</text><text x="370" y="462" font-size="10.5" font-weight="400" fill="#DC2626" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">cannot finish</text><text x="28" y="596" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">Fast path and clarify answer straight back to the caller. AI disclosure and itinerary read-back cannot be interrupted.</text></svg>
