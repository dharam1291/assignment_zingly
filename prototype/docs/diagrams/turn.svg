6s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#DC2626"/></marker><marker id="m0891b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0891B2"/></marker><marker id="m0891b2s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0891B2"/></marker><marker id="m7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="m7c3aeds" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7C3AED"/></marker><marker id="m2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="m2563ebs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2563EB"/></marker><marker id="m0d9488" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="m0d9488s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0D9488"/></marker></defs><rect width="1240" height="620" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><text x="28" y="38" font-size="17" font-weight="700" fill="#0F172A">One caller turn</text><text x="28" y="58" font-size="11.5" fill="#475569">Cheap paths first: rules before any model, the active agent before the classifier, a person whenever the bot cannot finish safely.</text><rect x="28" y="122" width="110" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="83.0" y="145.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Caller</t