<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 790" width="1240" height="790" role="img" aria-label="How a reservation call is protected (inside the MCP server)" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="m64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="m64748bs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#64748B"/></marker><marker id="m4f46e5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="m4f46e5s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4F46E5"/></marker><marker id="me11d48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E11D48"/></marker><marker id="me11d48s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#E11D48"/></marker><marker id="m059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="m059669s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#059669"/></marker><marker id="md97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="md97706s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#D97706"/></marker><marker id="mdc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="mdc2626s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#DC2626"/></marker><marker id="m0891b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0891B2"/></marker><marker id="m0891b2s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0891B2"/></marker><marker id="m7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="m7c3aeds" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7C3AED"/></marker><marker id="m2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="m2563ebs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2563EB"/></marker><marker id="m0d9488" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker><marker id="m0d9488s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0D9488"/></marker></defs><rect width="1240" height="790" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><text x="28" y="38" font-size="17" font-weight="700" fill="#0F172A">How a reservation call is protected (inside the MCP server)</text><text x="28" y="58" font-size="11.5" fill="#475569">Every client goes through the same checks: the voice agent, Codex, the MCP Inspector. Writes are never served from the copy and never retried blindly.</text><rect x="28" y="112" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.6"/><text x="103.0" y="135.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">tools/call</text><text x="103.0" y="151.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">from any MCP client</text><rect x="206" y="100" width="196" height="80" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/><text x="304.0" y="121.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Identity token</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="304.0" y="137.5">signature · tenant · expiry</tspan><tspan x="304.0" y="151.0">→ level + booking</tspan><tspan x="304.0" y="164.5">none or invalid → unknown</tspan></text><rect x="430" y="112" width="170" height="56" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/><text x="515.0" y="135.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Guard</text><text x="515.0" y="151.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">tool allowed at this level?</text><rect x="628" y="112" width="196" height="56" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/><text x="726.0" y="135.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Booking scope</text><text x="726.0" y="151.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">booking = token&#x27;s booking?</text><rect x="852" y="112" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="947.0" y="135.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Which data?</text><text x="947.0" y="151.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">shared, or the caller&#x27;s own</text><path d="M178,140 L206,140" fill="none" stroke="#0891B2" stroke-width="1.5" marker-end="url(#m0891b2)"/><path d="M402,140 L430,140" fill="none" stroke="#0891B2" stroke-width="1.5" marker-end="url(#m0891b2)"/><path d="M600,140 L628,140" fill="none" stroke="#0891B2" stroke-width="1.5" marker-end="url(#m0891b2)"/><path d="M824,140 L852,140" fill="none" stroke="#0891B2" stroke-width="1.5" marker-end="url(#m0891b2)"/><rect x="470" y="222" width="210" height="50" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/><text x="575.0" y="242.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">denied</text><text x="575.0" y="258.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">nothing reaches the PSS</text><path d="M515,168 L515,222" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#mdc2626)"/><text x="523" y="200" font-size="10.5" font-weight="400" fill="#DC2626" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">not allowed</text><path d="M726,168 L726,247 L680,247" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#mdc2626)"/><text x="734" y="200" font-size="10.5" font-weight="400" fill="#DC2626" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">other booking</text><path d="M947,168 V230" fill="none" stroke="#0891B2" stroke-width="1.5"/><path d="M947,230 L760,230 L760,300" fill="none" stroke="#0891B2" stroke-width="1.5" marker-end="url(#m0891b2)"/><path d="M947,230 L1076,230 L1076,300" fill="none" stroke="#0891B2" stroke-width="1.5" marker-end="url(#m0891b2)"/><text x="860" y="222" font-size="10.5" font-weight="400" fill="#0891B2" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">status · options · caller-ID hint</text><text x="1080" y="222" font-size="10.5" font-weight="400" fill="#0891B2" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">verify · booking · rebook</text><rect x="660" y="300" width="200" height="64" rx="8" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.6"/><text x="760.0" y="320.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Saved copy fresh?</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="760.0" y="336.2">25 s for options</tspan><tspan x="760.0" y="349.8">filled by the disruption pre-warm</tspan></text><rect x="940" y="296" width="272" height="84" rx="8" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.6"/><text x="1076.0" y="319.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Breaker closed + lane token?</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="1076.0" y="335.5">within the lane&#x27;s wait budget</tspan><tspan x="1076.0" y="349.0">P0 3 s · P1 1.5 s · P2 0.5 s · P3 0 s</tspan><tspan x="1076.0" y="362.5">higher lanes borrow idle capacity</tspan></text><path d="M860,332 L940,332" fill="none" stroke="#0891B2" stroke-width="1.5" marker-end="url(#m0891b2)"/><text x="900" y="322" font-size="10.5" font-weight="400" fill="#0891B2" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no: one loader</text><text x="900" y="352" font-size="10.5" font-weight="400" fill="#0891B2" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">per key</text><rect x="660" y="436" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.6"/><text x="760.0" y="459.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Answer the caller</text><text x="760.0" y="475.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">from the copy: 0 PSS requests</text><path d="M760,364 L760,436" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#m059669)"/><text x="768" y="386" font-size="10.5" font-weight="400" fill="#059669" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><rect x="1000" y="436" width="212" height="56" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.6"/><text x="1106.0" y="459.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Airline PSS</text><text x="1106.0" y="475.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">hard 5 req/s</text><path d="M1106,380 L1106,436" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#m059669)"/><text x="1114" y="412" font-size="10.5" font-weight="400" fill="#059669" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><path d="M1000,464 L860,464" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#m059669)"/><text x="930" y="456" font-size="10.5" font-weight="400" fill="#059669" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">ok</text><rect x="380" y="436" width="236" height="70" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/><text x="498.0" y="452.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Lane full: degrade, don&#x27;t fail</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="498.0" y="468.5">read → saved copy labelled &#x27;as of&#x27;</tspan><tspan x="498.0" y="482.0">rebook → deferred commit</tspan><tspan x="498.0" y="495.5">(same idempotency key, SMS later)</tspan></text><path d="M980,380 L980,408 L498,408 L498,436" fill="none" stroke="#D97706" stroke-width="1.5" marker-end="url(#md97706)"/><text x="600" y="400" font-size="10.5" font-weight="400" fill="#D97706" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no: lane full</text><rect x="1000" y="588" width="212" height="56" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/><text x="1106.0" y="611.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Read the booking back</text><text x="1106.0" y="627.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">never a blind retry</text><path d="M1106,492 L1106,588" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#mdc2626)"/><text x="1114" y="544" font-size="10.5" font-weight="400" fill="#DC2626" text-anchor="start" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">write timed out</text><path d="M1000,616 H976" fill="none" stroke="#4F46E5" stroke-width="1.5"/><path d="M976,558 V696" fill="none" stroke="#4F46E5" stroke-width="1.5"/><rect x="716" y="532" width="232" height="52" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.6"/><text x="832.0" y="553.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Moved → confirmed</text><text x="832.0" y="569.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">the write had landed</text><path d="M976,558.0 L948,558.0" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#m4f46e5)"/><rect x="716" y="600" width="232" height="52" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/><text x="832.0" y="621.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Unchanged → unavailable</text><text x="832.0" y="637.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">booking untouched; handover</text><path d="M976,626.0 L948,626.0" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#m4f46e5)"/><rect x="716" y="668" width="232" height="56" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/><text x="832.0" y="684.0" font-size="12.5" font-weight="650" fill="#0F172A" text-anchor="middle">Unreadable → reconcile</text><text font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="832.0" y="700.2">outcome unknown: replay later</tspan><tspan x="832.0" y="713.8">under the same idempotency key</tspan></text><path d="M976,696.0 L948,696.0" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#m4f46e5)"/><text x="28" y="766" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">Lanes split the PSS limit 40/30/20/10 under a parent limit set a little below it (4 of 5 req/s). Counters live in memory here and in Redis in production.</text></svg>
