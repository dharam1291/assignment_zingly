title: P0 lane saturated, the choice becomes a deferred commit
summary: >
  The booking lane P0 is saturated (paused here to make it deterministic). Instead of an
  error the caller hears the deferred-commit wording; the MCP server commits later under the
  same idempotency key and the booking really moves.
demonstrates: [priority lanes, P0 fallback, deferred commit, idempotency key]
setup:
  - reset: true
  - prewarm: {tenant: atlantica, flight: AT123}
calls:
  - dialed: "+448000001234"
    caller: "+15550000008"
    steps:
      - say: "yes"
      - say: "my booking ABC123 was cancelled"
      - say: "Smith"
      - say: "the second"
      - do: {pause_lanes: {tenant: atlantica, lanes: [P0], seconds: 5}}
      - say: "yes"
        expect: {contains: "within 30 minutes"}
      - say: "no thanks"
        expect: {status: COMPLETED}
      - wait: 8
checks:
  - deferred: {tenant: atlantica, confirmed: 1}
  - pss_booking: {airline: atlantica, ref: ABC123, flight: AT131}
