title: Reservation system down, nothing saved
summary: >
  The PSS returns errors and nothing is pre-warmed. Verification cannot be checked, so no
  attempt is used up and the caller is handed over with the exact state and a callback offer.
demonstrates: ["degraded mode - reservation system down", safe failure, callback offer]
setup:
  - reset: true
  - pss_mode: {airline: atlantica, error_rate: 1.0}
calls:
  - dialed: "+448000001234"
    caller: "+15550000006"
    steps:
      - say: "yes"
      - say: "my booking ABC123 was cancelled"
      - say: "Smith"
        expect: {status: AGENT_HANDOVER, handover: {subcategory: verification_unavailable,
                                                    disposition: callback_offered}}
