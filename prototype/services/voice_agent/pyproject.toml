[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zingly-voice-agent"
version = "0.1.0"
description = "Voice Agent service: Genesys-facing gateway composing the Zingly libraries; an MCP client of the Zingly MCP server"
requires-python = ">=3.11"
dependencies = [
  "zingly-core", "zingly-channel", "zingly-ai-router", "zingly-agents", "zingly-auth", "zingly-handover",
  "mcp==1.30.0", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
