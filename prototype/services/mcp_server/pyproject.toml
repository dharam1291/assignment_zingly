[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zingly-mcp-server"
version = "0.1.0"
description = "Zingly MCP server: reservation tools over the Model Context Protocol, one endpoint per tenant"
requires-python = ">=3.11"
dependencies = [
  "zingly-core", "zingly-policy", "zingly-saved-copy", "zingly-mcp",
  "mcp==1.30.0", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
