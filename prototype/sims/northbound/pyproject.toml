[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zingly-sim-northbound"
version = "0.1.0"
description = "Northbound simulator: Genesys inbound flow, queues, callback, agent desktop"
requires-python = ">=3.11"
dependencies = ["zingly-core", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genesys_sim = ["ui.html"]
