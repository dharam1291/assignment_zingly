[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zingly-sim-southbound"
version = "0.1.0"
description = "Southbound simulator: the airline's reservation system (PSS), rate limited"
requires-python = ">=3.11"
dependencies = ["zingly-core", "fastapi>=0.115", "uvicorn>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]
