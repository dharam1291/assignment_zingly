[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zingly-agents"
version = "0.1.0"
description = "Supervisor and domain agents (deterministic mode)"
requires-python = ">=3.11"
dependencies = ["zingly-core"]

[tool.setuptools.packages.find]
where = ["src"]
