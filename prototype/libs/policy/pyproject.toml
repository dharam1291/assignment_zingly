[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zingly-policy"
version = "0.1.0"
description = "Guardrails, priority lanes, circuit breaker"
requires-python = ">=3.11"
dependencies = ["zingly-core"]

[tool.setuptools.packages.find]
where = ["src"]
