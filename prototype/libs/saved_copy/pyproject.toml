[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zingly-saved-copy"
version = "0.1.0"
description = "Tenant-namespaced saved copy with single-flight"
requires-python = ">=3.11"
dependencies = ["zingly-core"]

[tool.setuptools.packages.find]
where = ["src"]
