[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zingly-handover"
version = "0.1.0"
description = "AGENT_HANDOVER payload for the Genesys screen-pop"
requires-python = ">=3.11"
dependencies = ["zingly-core"]

[tool.setuptools.packages.find]
where = ["src"]
