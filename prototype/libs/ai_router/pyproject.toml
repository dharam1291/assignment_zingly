[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zingly-ai-router"
version = "0.1.0"
description = "Welcome, consent, fast path, disambiguation, business routing"
requires-python = ">=3.11"
dependencies = ["zingly-core"]

[tool.setuptools.packages.find]
where = ["src"]
